title: Mein Rezeptbuch
description: Rezepte aus Instagram, Websites, Videos und Fotos.
lang: de

# GitHub Pages serves this repository at https://<user>.github.io/my-recipe-book/
baseurl: "/my-recipe-book"

collections:
  recipes:
    output: true
    permalink: /recipes/:name/

defaults:
  - scope:
      path: ""
      type: recipes
    values:
      layout: recipe

exclude:
  - README.md
  - CLAUDE.md
  - docs/
  - .github/
  - web/
